[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-preprocess-workbench"
version = "0.1.0"
description = "Reusable video preprocessing CLI and notebook helper for batch resize, FPS conversion, ROI blur, and reporting."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "ltb1021"},
]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
]

[project.urls]
Homepage = "https://github.com/ltb1021/video-preprocess-workbench"
Repository = "https://github.com/ltb1021/video-preprocess-workbench"

[project.scripts]
video-preprocess-lab = "video_preprocess_workbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

